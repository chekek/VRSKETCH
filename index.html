<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Wall Draw</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
  #info{position:fixed;top:12px;left:12px;right:12px;font-size:14px;line-height:1.5;
        background:#000a;padding:10px 14px;border-radius:10px;max-width:520px}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="info">
  <b>AR Wall Draw</b> (Pico 4)<br>
  Нажми «START AR» внизу. Управление:<br>
  X — калибровка стены (3 касания триггером) · A — стена/воздух<br>
  Триггер — рисовать · B — отмена штриха · Y — очистить<br>
  Правый стик: ←→ цвет, ↑↓ толщина · нажатие стика — сетка вкл/выкл
</div>

<script type="module">
import * as THREE from 'three';
import {ARButton} from 'three/addons/webxr/ARButton.js';

// ---------- базовая сцена ----------
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(ARButton.createButton(renderer, {optionalFeatures:['local-floor']}));
renderer.xr.addEventListener('sessionstart', () => document.getElementById('info').style.display = 'none');
renderer.xr.addEventListener('sessionend',   () => document.getElementById('info').style.display = '');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 50);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1,2,1); scene.add(sun);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- штрихи: один InstancedMesh из сфер ----------
const MAX = 60000;
const dots = new THREE.InstancedMesh(
  new THREE.IcosahedronGeometry(1, 1),
  new THREE.MeshStandardMaterial({roughness:0.6}), MAX);
dots.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
dots.count = 0; dots.frustumCulled = false;
scene.add(dots);

const strokes = [];          // индексы начала каждого штриха (для undo)
const color = new THREE.Color();
let hue = 0.6, size = 0.006; // радиус кисти, м
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();

function addDot(p) {
  if (dots.count >= MAX) return;
  _m.compose(p, _q, _s.setScalar(size));
  dots.setMatrixAt(dots.count, _m);
  dots.setColorAt(dots.count, color);
  dots.count++;
  dots.instanceMatrix.needsUpdate = true;
  dots.instanceColor.needsUpdate = true;
}

// ---------- стена ----------
const wall = {plane:null, snap:true, calibrating:false, pts:[], grid:null, showGrid:true};
const calibMarks = new THREE.Group(); scene.add(calibMarks);

function startCalibration() {
  wall.calibrating = true; wall.pts = []; wall.plane = null;
  calibMarks.clear();
  if (wall.grid) { scene.remove(wall.grid); wall.grid = null; }
  hud();
}

function addCalibPoint(p) {
  wall.pts.push(p.clone());
  const mk = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8),
                            new THREE.MeshBasicMaterial({color:0xff3355}));
  mk.position.copy(p); calibMarks.add(mk);
  if (wall.pts.length === 3) finishCalibration();
  hud();
}

function finishCalibration() {
  const [a, b, c] = wall.pts;
  const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a));
  if (n.lengthSq() < 1e-8) { startCalibration(); return; }   // точки на одной линии
  n.normalize();
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, a);
  const head = renderer.xr.getCamera().position;
  if (plane.distanceToPoint(head) < 0) plane.negate();       // нормаль смотрит на пользователя
  wall.plane = plane; wall.calibrating = false;

  const centroid = new THREE.Vector3().add(a).add(b).add(c).multiplyScalar(1/3);
  const grid = new THREE.GridHelper(4, 40, 0x44ccff, 0x44ccff);
  grid.material.transparent = true; grid.material.opacity = 0.25;
  grid.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), plane.normal);
  grid.position.copy(plane.projectPoint(centroid, new THREE.Vector3()));
  grid.visible = wall.showGrid;
  wall.grid = grid; scene.add(grid);
  calibMarks.clear();
}

// ---------- HUD на левом контроллере ----------
const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
const tex = new THREE.CanvasTexture(cv);
const hudMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.08),
  new THREE.MeshBasicMaterial({map:tex, transparent:true}));
hudMesh.rotation.x = -Math.PI/3; hudMesh.position.set(0, 0.09, -0.02);

function hud() {
  const g = cv.getContext('2d');
  g.clearRect(0,0,512,256);
  g.fillStyle = '#000c'; g.fillRect(0,0,512,256);
  g.fillStyle = '#fff'; g.font = 'bold 34px sans-serif';
  const mode = wall.snap ? 'СТЕНА' : 'ВОЗДУХ';
  let st = wall.calibrating ? `Калибровка: ${wall.pts.length}/3`
         : wall.plane ? 'Стена задана' : 'Стена не задана (X)';
  g.fillText('Режим: ' + mode, 20, 55);
  g.fillText(st, 20, 105);
  g.fillText('Толщина: ' + (size*2000).toFixed(0) + ' мм', 20, 155);
  g.fillStyle = '#' + color.clone().setHSL(hue,1,0.55).getHexString();
  g.fillRect(20, 180, 472, 50);
  tex.needsUpdate = true;
}

// ---------- контроллеры ----------
const ctrls = [];
let drawer = null;                 // кто сейчас рисует
const tip = new THREE.Vector3(), tmp = new THREE.Vector3();

for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.userData = {src:null, prev:[], last:null, started:false};
  c.add(new THREE.Mesh(new THREE.SphereGeometry(0.008, 12, 8),
                       new THREE.MeshBasicMaterial({color:0xffffff})));
  c.addEventListener('connected', e => {
    c.userData.src = e.data;
    if (e.data.handedness === 'left') c.add(hudMesh);
    hud();
  });
  c.addEventListener('disconnected', () => { c.userData.src = null; });
  scene.add(c); ctrls.push(c);
}

function buzz(gp) {
  try { gp.hapticActuators?.[0]?.pulse(0.4, 40); } catch {}
}

function handle(c, dt) {
  const u = c.userData, src = u.src;
  if (!src || !src.gamepad) return;
  const gp = src.gamepad, b = gp.buttons, hand = src.handedness;
  const down = i => b[i]?.pressed && !u.prev[i];
  c.getWorldPosition(tip);

  // кнопки
  if (hand === 'left'  && down(4)) startCalibration();                       // X
  if (hand === 'left'  && down(5)) { dots.count = 0; strokes.length = 0; }   // Y
  if (hand === 'right' && down(4)) { wall.snap = !wall.snap; hud(); }        // A
  if (hand === 'right' && down(5)) {                                         // B
    if (strokes.length) dots.count = strokes.pop();
  }
  if (down(3) && wall.grid) { wall.showGrid = !wall.showGrid; wall.grid.visible = wall.showGrid; }

  // правый стик: цвет и толщина
  if (hand === 'right') {
    const x = gp.axes[2] || 0, y = gp.axes[3] || 0;
    if (Math.abs(x) > 0.15) { hue = (hue + x * dt * 0.4 + 1) % 1; hud(); }
    if (Math.abs(y) > 0.15) { size = THREE.MathUtils.clamp(size - y * dt * 0.006, 0.002, 0.03); hud(); }
  }
  color.setHSL(hue, 1, 0.55);

  // триггер
  const trig = b[0]?.pressed;
  if (trig && !u.prev[0]) {
    if (wall.calibrating) { addCalibPoint(tip); buzz(gp); }
    else if (!drawer) { drawer = c; u.last = null; u.started = false; }
  }
  if (!trig && drawer === c) drawer = null;

  if (trig && drawer === c && !wall.calibrating) {
    let p = tip;
    if (wall.snap) {
      if (!wall.plane) { u.last = null; }                                    // стена не задана
      else if (Math.abs(wall.plane.distanceToPoint(tip)) > 0.3) { u.last = null; p = null; } // далеко от стены
      else {
        p = wall.plane.projectPoint(tip, new THREE.Vector3())
              .addScaledVector(wall.plane.normal, size * 0.5);
      }
      if (!wall.plane) p = null;
    }
    if (p) {
      if (!u.started) { strokes.push(dots.count); u.started = true; }
      const step = Math.max(size * 0.5, 0.002);
      if (!u.last) { addDot(p); u.last = p.clone(); }
      else {
        const d = u.last.distanceTo(p);
        if (d >= step) {
          const n = Math.floor(d / step);
          for (let k = 1; k <= n; k++) addDot(tmp.lerpVectors(u.last, p, k / n));
          u.last.copy(p);
        }
      }
    }
  }

  for (let i = 0; i < b.length; i++) u.prev[i] = b[i].pressed;
}

// ---------- цикл ----------
let tPrev = 0;
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - tPrev) / 1000, 0.1); tPrev = t;
  for (const c of ctrls) handle(c, dt);
  renderer.render(scene, camera);
});
hud();
</script>
</body>
</html>
